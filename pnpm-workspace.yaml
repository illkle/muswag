  "@tanstack/db": ^0.7.2
  "@tanstack/node-db-sqlite-persistence": ^0.2.12
  "@tanstack/db-sqlite-persistence-core": ^0.2.12
  "@tanstack/react-db": ^0.2.1
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^26.2.0
  "@effect/tsgo": "0.36.5"
  effect: "4.0.0-rc.109"
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  fuse.js: ^7.5.0
  typescript: ^7.0.2
  vitest: ^4.1.10
  zod: ^4.4.3

onlyBuiltDependencies:
  - better-sqlite3
  - cpu-features
  - electron
  - electron-winstaller
  - esbuild
  - msw
  - protobufjs
