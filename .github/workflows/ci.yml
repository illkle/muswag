name: CI

on:
  pull_request:
  push:
    branches:
      - master
  # The release workflow runs these checks on the commit it builds.
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up workspace
        uses: ./.github/actions/setup

      # Each check runs even when one before it failed, so that one run reports every problem.
      - name: Format
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

  mpv-smoke:
    name: Real mpv playback
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Install mpv
        run: brew install mpv

      - name: Exercise real mpv with null audio output
        env:
          MUSWAG_MPV_INTEGRATION: "1"
        run: pnpm --filter @muswag/desktop exec vitest run src/main/player/mpv/mpv-integration.test.ts
