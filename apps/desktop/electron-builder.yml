appId: com.muswag.desktop
productName: muswag
directories:
  buildResources: build
icon: icon.png
files:
  - out/**
  # Sourcemaps are for debugging a build here, and are as large as the rest of the app.
  - "!out/**/*.map"
  - package.json
# The UI is in English. `en-US` also keeps macOS's `en.lproj`.
electronLanguages:
  - en-US
asar:
  smartUnpack: false
win:
  executableName: muswag
  artifactName: muswag-Setup-${version}.${ext}
  target:
    - nsis
mac:
  category: public.app-category.music
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
linux:
  executableName: muswag
  category: AudioVideo
  maintainer: illkle <kelolov@gmail.com>
  artifactName: muswag-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
npmRebuild: false
publish:
  provider: github
  owner: illkle
  repo: muswag
  releaseType: draft
