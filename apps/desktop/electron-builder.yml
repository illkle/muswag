appId: com.muswag.desktop
productName: muswag
directories:
  buildResources: build
icon: icon.png
files:
  - out/**
  - package.json
  - "!node_modules/better-sqlite3/{deps,src}/**"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/build/{deps,Release/obj}/**"
  - "!node_modules/better-sqlite3/build/Release/test_extension.node"
asar:
  smartUnpack: false
asarUnpack:
  - node_modules/better-sqlite3/**/*.node
win:
  executableName: muswag
  target:
    - nsis
mac:
  category: public.app-category.music
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
linux:
  executableName: muswag
  category: AudioVideo
  maintainer: illkle <kelolov@gmail.com>
  artifactName: muswag-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
npmRebuild: false
publish:
  provider: github
  owner: illkle
  repo: muswag
  releaseType: draft
